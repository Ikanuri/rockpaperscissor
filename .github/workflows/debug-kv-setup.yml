# DEBUG SEMENTARA — workflow sekali pakai untuk membuat KV namespace debug. Hapus branch ini setelah ID dicatat.
name: Debug KV setup (TEMPORARY)

on:
  push:
    branches: [debug-kv-setup]

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create DEBUG_KV namespace (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[]? | select(.title=="rps-debug-kv") | .id')
          if [ -n "$EXISTING" ]; then
            echo "DEBUG_KV_ID=$EXISTING (already existed)"
          else
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data '{"title":"rps-debug-kv"}')
            echo "$RESULT" | jq '{success, errors, id: .result.id}'
            echo "DEBUG_KV_ID=$(echo "$RESULT" | jq -r '.result.id')"
          fi
