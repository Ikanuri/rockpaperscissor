# SEKALI PAKAI — menghapus sisa debug di Cloudflare (namespace KV + secret DEBUG_SECRET beta). Branch ini dihapus sesudahnya.
name: Debug cleanup (TEMPORARY)

on:
  push:
    branches: [debug-kv-setup]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Namespace sudah dihapus pada run sebelumnya
        run: echo "lewati (sudah dihapus: success true)"
      - name: Delete DEBUG_SECRET from beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          yes | npx --yes wrangler@4 secret delete DEBUG_SECRET --name rps-bot-beta 2>&1
          echo "exit=$?"
          npx --yes wrangler@4 secret list --name rps-bot-beta 2>&1 | grep -c DEBUG_SECRET || true
