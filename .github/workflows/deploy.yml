name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master, claude/telegram-rps-game-bot-2C6Ix]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create or find KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESPONSE=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          KV_ID=$(echo "$RESPONSE" | jq -r '.result[] | select(.title == "rps-bot-GAME_SESSIONS") | .id' 2>/dev/null)

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "KV namespace not found, creating..."
            CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"title":"rps-bot-GAME_SESSIONS"}')
            KV_ID=$(echo "$CREATE" | jq -r '.result.id')
          fi

          echo "KV ID: $KV_ID"
          sed -i "s/REPLACE_WITH_KV_ID/${KV_ID}/g" wrangler.toml
          sed -i "s/REPLACE_WITH_KV_PREVIEW_ID/${KV_ID}/g" wrangler.toml

      - name: Set bot username in config
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
        run: |
          sed -i "s|BOT_USERNAME = \"\"|BOT_USERNAME = \"${BOT_USERNAME}\"|" wrangler.toml

      - name: Push secrets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          echo "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN
          echo "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          echo "$DEPLOY_OUT"
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oP 'https://\S+\.workers\.dev' | head -1)
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT

      - name: Register Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          WORKER_URL="${{ steps.deploy.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️  Could not detect worker URL from deploy output."
            exit 0
          fi
          echo "Registering webhook: $WORKER_URL"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            -d 'allowed_updates=["inline_query","chosen_inline_result","callback_query"]' \
            | jq .
