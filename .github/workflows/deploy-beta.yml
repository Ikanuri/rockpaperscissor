name: Deploy Beta to Cloudflare Workers

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push BOT_TOKEN secret to beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN_BETA }}
        run: echo "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN --env beta

      # DEBUG SEMENTARA: DEBUG_SECRET diturunkan otomatis (HMAC-SHA256 dari token Cloudflare, satu arah)
      # supaya tidak perlu dibuat/disalin manual; workflow debug-read menghitung nilai yang sama.
      - name: Derive and push DEBUG_SECRET to beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEBUG_SECRET=$(printf 'debug-endpoint-v1' | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          echo "::add-mask::$DEBUG_SECRET"
          echo "$DEBUG_SECRET" | npx wrangler secret put DEBUG_SECRET --env beta

      - name: Deploy beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env beta
