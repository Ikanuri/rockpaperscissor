name: Deploy Beta to Cloudflare Workers

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push BOT_TOKEN secret to beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN_BETA }}
        run: echo "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN --env beta

      # DEBUG SEMENTARA: secret untuk endpoint /debug (opsional; tanpa ini endpoint tetap 404)
      - name: Push DEBUG_SECRET to beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEBUG_SECRET: ${{ secrets.DEBUG_SECRET }}
        run: |
          if [ -n "$DEBUG_SECRET" ]; then
            echo "$DEBUG_SECRET" | npx wrangler secret put DEBUG_SECRET --env beta
          else
            echo "DEBUG_SECRET belum ada di GitHub Secrets — /debug tetap nonaktif (404)"
          fi

      - name: Deploy beta Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env beta
