name = "rps-bot"
main = "src/index.ts"
compatibility_date = "2024-09-19"

[vars]
# Set to your bot's username WITHOUT the @ symbol
BOT_USERNAME = "JankensBot"
# Your Telegram user ID — enables owner DM commands
BOT_OWNER_ID = ""
# Lottie sticker file_ids — leave empty to use article fallback (overridable via /setglobal sticker)
STICKER_ROCK = ""
STICKER_PAPER = ""
STICKER_SCISSORS = ""
# Custom emoji IDs for animated emoji in reveal/result messages (overridable via /setglobal emoji reveal)
# Get IDs: forward a custom emoji sticker to @RawDataBot, copy custom_emoji_id
CUSTOM_EMOJI_ROCK = ""
CUSTOM_EMOJI_PAPER = ""
CUSTOM_EMOJI_SCISSORS = ""
# Comma-separated feature flags (leave empty for stable production)
FEATURE_FLAGS = ""

[[kv_namespaces]]
binding = "GAME_SESSIONS"
# Run: npx wrangler kv namespace create GAME_SESSIONS
# Then paste the output id below
id = "c8e5c7ebf6264fe9b450f6794d234d8e"
preview_id = "c8e5c7ebf6264fe9b450f6794d234d8e"

# Secrets — set via CLI (never put real values here):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put STRIPE_SECRET_KEY       (optional, enables Stripe payments)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   (optional, required with STRIPE_SECRET_KEY)
#
# Webhook registration:
#   curl "https://api.telegram.org/bot<TOKEN>/setWebhook" \
#     -d "url=https://rps-bot.<account>.workers.dev" \
#     -d "secret_token=<WEBHOOK_SECRET>" \
#     -d 'allowed_updates=["inline_query","chosen_inline_result","callback_query","message"]'

# ─── Beta Environment ────────────────────────────────────────────────────────
# Deploy: npx wrangler deploy --env beta
# Secrets: npx wrangler secret put BOT_TOKEN --env beta
#          npx wrangler secret put WEBHOOK_SECRET --env beta
#          npx wrangler secret put STRIPE_SECRET_KEY --env beta      (optional)
#          npx wrangler secret put STRIPE_WEBHOOK_SECRET --env beta  (optional)
# Secrets (beta): npx wrangler secret put BOT_TOKEN --env beta
#                 npx wrangler secret put WEBHOOK_SECRET --env beta
#                 npx wrangler secret put STRIPE_SECRET_KEY --env beta       (optional)
#                 npx wrangler secret put STRIPE_WEBHOOK_SECRET --env beta   (optional)
# Webhook: curl "https://api.telegram.org/bot<BETA_TOKEN>/setWebhook" \
#            -d "url=https://rps-bot-beta.<account>.workers.dev" \
#            -d "secret_token=<WEBHOOK_SECRET>" \
#            -d 'allowed_updates=["inline_query","chosen_inline_result","callback_query","message","pre_checkout_query"]'

[env.beta]
name = "rps-bot-beta"

[env.beta.vars]
BOT_USERNAME = "gubakebetabot"
BOT_OWNER_ID = "582589514"
STICKER_ROCK = ""
STICKER_PAPER = ""
STICKER_SCISSORS = ""
CUSTOM_EMOJI_ROCK = ""
CUSTOM_EMOJI_PAPER = ""
CUSTOM_EMOJI_SCISSORS = ""
# All beta features enabled
FEATURE_FLAGS = "donator,gif_thumb,leaderboard,refresh_button,beta_config,group_mode"

[env.beta.triggers]
crons = ["0 0 * * *"]

[[env.beta.kv_namespaces]]
binding = "GAME_SESSIONS"
# Run: npx wrangler kv namespace create GAME_SESSIONS --env beta
# Then paste the output id below
id = "0475907e01f74cb5bc215856bd1753a6"
preview_id = "0475907e01f74cb5bc215856bd1753a6"
